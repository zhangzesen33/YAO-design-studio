<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAO-design-studio</title>
    <style>
      :root { --ink: #0f172a; --muted: #94a3b8; --line: #e2e8f0; --paper: #f8fafc; --blue: #4a5fff; --blue-wash: #f1f5f9; --chip: #f1f5f9; --green: #20a660; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; color: var(--ink); background: var(--paper); font-family: 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', system-ui, sans-serif; }
      body::before { content: ''; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 37%, rgb(255 255 255 / .9), transparent 46%); }
      button, select, textarea, input { font: inherit; } button { cursor: pointer; }
      .app {
        --header-height: 102px;
        width: min(1520px, calc(100% - 48px));
        min-height: 100vh;
        min-height: 100dvh;
        margin: auto;
        position: relative;
        display: grid;
        grid-template-rows: minmax(var(--header-height), 1fr) auto minmax(24px, 1fr);
      }
      header { height: var(--header-height); align-self: start; display: flex; align-items: center; justify-content: flex-end; }
      .header-actions { position: relative; display: flex; gap: 10px; align-items: center; transform: translateX(8px); } .header-actions > button { min-height: 43px; padding: 0 15px; border: 1px solid #e3e6ea; border-radius: 13px; color: #3a3e44; background: rgb(255 255 255 / .7); font-size: 13px; }.queue-trigger { display: inline-flex; align-items: center; gap: 8px; }.queue-summary { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px; border-radius: 99px; font-size: 11px; line-height: 16px; }.queue-summary img { width: 12px; height: 12px; }.queue-summary.running { color: #2c87ff; background: rgb(44 135 255 / .1); }.queue-summary.running img { animation: queue-spin 1s linear infinite; }.queue-summary.done { color: #00a818; background: rgb(32 203 55 / .1); }.queue-summary.failed { color: #dc4545; background: rgb(220 69 69 / .1); }.queue-trigger > img { width: 9px; height: 6px; transition: transform .2s ease; }.queue-trigger[aria-expanded="true"] > img { transform: rotate(180deg); }
      .key-button { display: flex; align-items: center; gap: 8px; } .dot { width: 7px; height: 7px; border-radius: 99px; background: #c7cbd0; }.dot.ready { background: var(--green); box-shadow: 0 0 0 3px #e7f7ed; }
      .generation-queue { position: absolute; top: calc(100% + 12px); right: 0; z-index: 4; width: 288px; height: 324px; overflow: hidden; }.generation-queue[hidden] { display: none; }.queue-list { display: flex; flex-direction: column; gap: 8px; height: 100%; padding: 0 1px 12px 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }.queue-list::-webkit-scrollbar { width: 5px; }.queue-list::-webkit-scrollbar-thumb { border-radius: 999px; background: #cbd5e1; }.queue-card { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 82px; padding: 13px 25px 13px 13px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; }.queue-card.done { padding-right: 13px; }.queue-copy { flex: 1 1 auto; min-width: 0; }.queue-prompt { overflow: hidden; color: #0f172a; font-size: 14px; font-weight: 500; line-height: 22px; text-overflow: ellipsis; white-space: nowrap; }.queue-meta { display: flex; align-items: center; gap: 4px; margin-top: 4px; color: #475569; font-size: 12px; line-height: 18px; white-space: nowrap; }.queue-status { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 16px; font-size: 12px; line-height: 18px; }.queue-status.running { color: #2c87ff; background: rgb(44 135 255 / .1); }.queue-status.done { color: #00c31a; background: rgb(32 203 55 / .1); }.queue-status.failed { color: #dc4545; background: rgb(220 69 69 / .1); }.queue-status img { width: 12px; height: 12px; }.queue-status.running img { animation: queue-spin 1s linear infinite; }.queue-error { margin-top: 5px; color: #c43d3d; font-size: 11px; line-height: 16px; overflow-wrap: anywhere; }.queue-reveal { display: inline-flex; flex: 0 0 auto; align-items: center; gap: 0; padding: 0; border: 0; color: #94a3b8; background: transparent; font-size: 12px; line-height: 22px; white-space: nowrap; }.queue-reveal:hover { color: #475569; }.queue-reveal img { width: 12px; height: 12px; transform: rotate(-90deg); }.queue-dismiss { position: absolute; top: 5px; right: 5px; width: 16px; height: 16px; padding: 0; border: 0; background: transparent; }.queue-dismiss img { display: block; width: 16px; height: 16px; }.queue-dismiss:hover { transform: scale(1.08); }.queue-fade { position: absolute; right: 0; bottom: 0; left: 0; height: 59px; pointer-events: none; background: linear-gradient(to top, var(--paper) 12.2%, rgb(248 250 252 / 0)); }@keyframes queue-spin { to { transform: rotate(360deg); } }
      .hero { text-align: center; }.figma-title { display: block; max-width: 100%; height: auto; margin: 0 auto; }.hero p { display: none; }
      .switcher { width: 392px; padding: 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: 20px auto 0; border-radius: 30px; background: #e2e8f0; }.switcher label { position: relative; min-height: 42px; display: grid; place-items: center; border-radius: 25px; color: #475569; font-weight: 400; font-size: 16px; transition: .2s ease; }.switcher input { position: absolute; opacity: 0; }.switcher label:has(input:checked) { background: #fff; color: #0f172a; box-shadow: none; font-weight: 500; }
      main { --workbench-side: 19%; margin-inline: var(--workbench-side); }.composer-wrap { width: 100%; margin: 20px auto 0; }.composer { height: 313px; position: relative; padding: 16px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 25px 50px -12px rgb(226 232 240 / .55); transition: border-color .2s ease, box-shadow .2s ease; }.composer:focus-within { border-color: #cbd5e1; box-shadow: 0 25px 50px -12px rgb(190 210 230 / .72); }
      .composition { display: flex; flex-direction: column; height: 100%; gap: 8px; padding-bottom: 52px; }.asset-slots { display: flex; justify-content: flex-start; gap: 8px; min-height: 72px; }.asset-slots[hidden], .reference-previews[hidden], .frame-slot[hidden], .asset-add[hidden] { display: none !important; }.frame-slot { display: flex; flex: 0 0 auto; }.asset-add { width: 72px; height: 72px; border: 0; border-radius: 8px; display: flex; flex: 0 0 auto; flex-direction: column; align-items: center; justify-content: center; gap: 3px; background: #f1f5f6; color: #94a3b8; font-size: 12px; transition: .2s ease; }.asset-add::after { content: attr(data-label); font-size: 12px; }.asset-add img { width: 16px; height: 16px; }.asset-add:hover { border-color: transparent; background: #e7f2f6; transform: translateY(-1px); }.asset-add input { display: none; }.reference-previews { display: flex; flex: 0 0 auto; gap: 8px; }.asset-preview { width: 72px; height: 72px; position: relative; overflow: visible; border-radius: 8px; background: #e2e8f0; }.asset-preview img, .asset-preview video { display: block; width: 72px; height: 72px; border-radius: 8px; object-fit: cover; background: #334155; }.asset-preview .video-mark { position: absolute; left: 6px; bottom: 5px; padding: 2px 4px; border-radius: 4px; color: #fff; background: rgb(15 23 42 / .68); font: 9px ui-monospace, SFMono-Regular, Menlo, monospace; }.preview-remove { width: 16px; height: 16px; position: absolute; top: 4px; right: 4px; z-index: 2; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; color: #fff; background: #ef4444; font-size: 13px; line-height: 1; box-shadow: 0 1px 4px rgb(15 23 42 / .2); }.preview-remove:hover { background: #dc2626; }
      .prompt { flex: 1; width: 100%; min-height: 0; margin: 0; resize: none; overflow-x: hidden; overflow-y: auto; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 16px; line-height: 1.65; letter-spacing: 0; font-weight: 400; }.prompt::placeholder { color: #94a3b8; }
      .composer-bottom { position: absolute; right: 12px; bottom: 12px; left: 12px; display: flex; gap: 12px; align-items: center; margin: 0; }.parameter-group { display: flex; gap: 12px; align-items: center; min-width: 0; }.parameter-group[hidden] { display: none; }.minor { display: none; }.minor#modeButton { display: none; }.param-select { appearance: none; width: 80px; max-width: 80px; height: 36px; padding: 0 8px; border: 1px solid #e2e8f0; border-radius: 8px; outline: 0; color: #475569; background: #f1f5f9 url("figma-assets/asset-2.svg") calc(100% - 10px) center / 9px 6px no-repeat; font-size: 14px; cursor: pointer; }.param-select.model-select { width: 170px; max-width: 170px; }.param-select:hover { color: #0f172a; background-color: #e9f1fb; }.param-select:disabled { opacity: .55; cursor: default; }.ratio-control { position: relative; display: block; width: 80px; height: 36px; }.ratio-control .param-select { width: 80px; }.ratio-tip { position: absolute; inset: 0; display: none; padding: 0; border: 0; background: transparent; cursor: pointer; }.ratio-tip:not([hidden]) { display: block; }.send { margin-left: auto; border: 0; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(145deg, #61c8ff, #4a5fff); box-shadow: 0 10px 15px -3px rgb(0 106 255 / .3), 0 4px 6px -4px rgb(0 140 255 / .3); color: #fff; font-size: 0; transition: transform .2s ease, filter .2s ease; }.send img { width: 14.67px; height: 14.67px; }.send.is-submitting img { animation: queue-spin 1s linear infinite; }.send:hover:not(:disabled) { filter: brightness(1.05); transform: translateY(-2px); }.send:disabled { opacity: 1; cursor: not-allowed; background: #e2e8f0 !important; box-shadow: none !important; }
      .media-area { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }.media-area:not([hidden]) { grid-template-rows: 1fr; }.media-area[hidden] { display: grid; visibility: hidden; }.media-inner { min-height: 0; overflow: hidden; }.media-inner > div { display: grid; gap: 12px; padding: 15px 4px 0; }.media-note { color: #858b93; font-size: 12px; }.media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }.media-grid.reference { grid-template-columns: repeat(3, 1fr); }.drop { min-height: 91px; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 15px; border: 1px dashed #cbd3db; border-radius: 14px; background: #fbfcfd; transition: .2s ease; }.drop:hover { border-color: #7cbcff; background: var(--blue-wash); }.drop strong { font-size: 13px; }.drop small { display: block; margin-top: 4px; color: #9ba1a9; font-size: 10px; }.drop input { width: 96px; font-size: 10px; }.url { border: 0; border-bottom: 1px solid #e1e6eb; outline: 0; padding: 7px 0; background: transparent; color: #555d66; font: 11px 'DM Mono', monospace; resize: vertical; }.url::placeholder { color: #aab0b7; }.ref-set { display: grid; gap: 7px; }
      .quickbar { display: none; }
      .inline-result { display: none; margin-top: 15px; padding-top: 15px; border-top: 1px solid #e8ecef; }.inline-result.active { display: block; }.inline-result video { display: block; width: min(480px, 100%); border-radius: 12px; background: #0f1114; }.inline-result a { display: inline-block; margin: 10px 12px 0 0; color: var(--blue); font-size: 12px; }
      .flash { min-height: 18px; margin: 10px 0 0; color: #d04b4b; text-align: center; font-size: 12px; }.flash.success { color: #00a818; }.notice { max-width: 606px; margin: 20px auto 0; color: #475569; text-align: left; font-size: 14px; line-height: 1.58; }.notice b { color: #475569; }
      dialog { width: min(540px, calc(100% - 32px)); padding: 26px; border: 1px solid #e0e5e9; border-radius: 18px; background: #fff; color: var(--ink); box-shadow: 0 24px 80px rgb(0 0 0 / .16); }dialog::backdrop { background: rgb(20 25 30 / .22); backdrop-filter: blur(3px); } dialog h3 { margin: 0; font-size: 21px; letter-spacing: -.05em; } dialog p { color: #7d838c; font-size: 13px; line-height: 1.7; }dialog input { width: 100%; padding: 11px 0; border: 0; border-bottom: 1px solid #dfe3e7; outline: 0; }.key-service-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0 4px; }.key-service-picker button { min-height: 58px; padding: 9px 8px; border: 1px solid #e2e8f0; border-radius: 10px; color: #475569; background: #f8fafc; font-size: 13px; line-height: 1.35; }.key-service-picker button.active { border-color: #a7c7ff; color: #0f172a; background: #edf5ff; font-weight: 600; }.dialog-actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }.dialog-actions button { padding: 10px 15px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; }.dialog-actions .cancel { padding-left: 0; color: #757c84; background: transparent; }.toast { position: fixed; left: 50%; bottom: 30px; z-index: 10; max-width: calc(100% - 32px); padding: 10px 15px; border-radius: 10px; color: #fff; background: rgb(15 23 42 / .92); box-shadow: 0 10px 30px rgb(15 23 42 / .2); font-size: 13px; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity .18s ease, transform .18s ease; }.toast.show { opacity: 1; transform: translate(-50%, 0); }
      @media (max-width: 760px) { .app { --header-height: 72px; width: min(100% - 48px, 600px); } main { margin-inline: 0; }.header-actions > button { min-height: 37px; padding: 0 10px; }.header-actions .hide-small { display: none; }.generation-queue { width: 100%; }.composer { padding: 16px 12px 12px; border-radius: 16px; }.asset-add { width: 72px; height: 72px; }.composer-bottom { gap: 7px; flex-wrap: nowrap; }.parameter-group { gap: 7px; }.param-select { width: 72px; min-width: 0; max-width: 72px; padding-left: 7px; font-size: 12px; }.param-select.model-select { width: 132px; max-width: 132px; }.send { width: 40px; height: 40px; }.media-grid.reference { grid-template-columns: 1fr; gap: 8px; }.media-grid { grid-template-columns: 1fr; }.switcher { width: min(392px, 100%); border-radius: 30px; }.switcher label { min-height: 42px; font-size: 13px; } }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="header-actions"><button id="openOutputFolder" type="button">前往视频文件夹</button><button class="queue-trigger" id="toggleQueue" type="button" aria-expanded="false" aria-controls="generationQueue"><span>生成队列</span><span class="queue-summary running" id="queueSummary"><img id="queueSummaryIcon" src="figma-assets/queue-spinner.svg" alt=""><span id="queueSummaryLabel">生成中</span></span><img src="figma-assets/asset-2.svg" alt=""></button><button class="key-button" id="openKey"><i class="dot" id="keyDot"></i><span id="keyText">检查密钥中</span></button><aside class="generation-queue" id="generationQueue" aria-label="生成队列" hidden><div class="queue-list" id="queueList"></div><div class="queue-fade" aria-hidden="true"></div></aside></div>
      </header>
      <main>
        <section class="hero">
          <img class="figma-title" src="figma-assets/title-yaosheji.svg" width="492" height="72" alt="要设计 视频工作台">
          <p>由 TokenHub MiniMax H3 驱动 · 你的素材与密钥仅在本机处理</p>
          <div class="switcher" id="modes">
            <label><input type="radio" name="mode" value="reference" checked>智能参考</label>
            <label><input type="radio" name="mode" value="frames">首尾帧</label>
            <label><input type="radio" name="mode" value="text">文生视频</label>
            <label><input type="radio" name="mode" value="image">生成图片</label>
          </div>
        </section>
        <section class="composer-wrap">
          <div class="composer">
            <div class="composition" id="composition" data-mode="reference">
              <div class="asset-slots" id="assetSlots">
                <div class="reference-previews" id="referencePreviews"></div>
                <label class="asset-add" id="referenceAdd" data-label="添加参考" title="添加参考图或视频"><img src="figma-assets/asset-1.svg" alt=""><input id="quickAsset" type="file" multiple accept="image/*,video/*,.heic,.heif"></label>
                <div class="reference-previews" id="imageReferencePreviews" hidden></div>
                <label class="asset-add" id="imageReferenceAdd" data-label="添加参考" title="添加图片参考" hidden><img src="figma-assets/asset-1.svg" alt=""><input id="imageAsset" type="file" multiple accept="image/*,.heic,.heif"></label>
                <div class="frame-slot" id="firstFrameSlot" hidden><label class="asset-add" id="firstFrameAdd" data-label="添加首帧" title="添加首帧图片"><img src="figma-assets/asset-1.svg" alt=""><input id="firstFile" type="file" accept="image/*,.heic,.heif"></label></div>
                <div class="frame-slot" id="lastFrameSlot" hidden><label class="asset-add" id="lastFrameAdd" data-label="添加尾帧" title="添加尾帧图片"><img src="figma-assets/asset-1.svg" alt=""><input id="lastFile" type="file" accept="image/*,.heic,.heif"></label></div>
              </div>
              <textarea class="prompt" id="prompt" placeholder="输入提示词"></textarea>
            </div>
            <div class="composer-bottom">
              <button class="minor" id="modeButton"><strong id="modeLabel">✦ 文生视频</strong></button>
              <div class="parameter-group" id="videoParams"><select class="param-select model-select" id="videoModel" aria-label="视频模型"><option value="h3">MiniMax H3</option><option value="seedance-2.5">Seedance 2.5</option><option value="seedance-2.0">Seedance 2.0</option></select><select class="param-select" id="resolution" aria-label="清晰度"></select><select class="param-select" id="duration" aria-label="时长"></select><span class="ratio-control"><select class="param-select" id="ratio" aria-label="画幅"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="3:4">3:4</option><option value="4:3">4:3</option><option value="1:1">1:1</option><option value="21:9">21:9</option><option value="adaptive">adaptive</option></select><button class="ratio-tip" id="ratioTip" type="button" aria-label="查看首尾帧画幅说明" hidden></button></span></div>
              <div class="parameter-group" id="imageParams" hidden><select class="param-select model-select" id="imageModel" aria-label="图片模型"><option value="8.2">Midjourney V8.2</option><option value="8.1">Midjourney V8.1</option><option value="7">Midjourney V7</option><option value="6.1">Midjourney V6.1</option><option value="5.2">Midjourney V5.2</option><option value="5.1">Midjourney V5.1</option></select><select class="param-select" id="imageRatio" aria-label="图片比例"><option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option><option value="3:4">3:4</option><option value="4:3">4:3</option><option value="21:9">21:9</option></select><select class="param-select" id="imageSpeed" aria-label="图片生成速度"><option value="relax">Relax</option><option value="fast">Fast</option><option value="turbo">Turbo</option></select></div>
              <button class="minor" id="dryRun">⌁ 校验请求</button>
              <button class="send" id="generate" aria-label="提交生成任务"><img src="figma-assets/asset-5.svg" alt=""></button>
            </div>
            <div class="media-area" id="frameMedia" hidden><div class="media-inner"><div><input class="url" id="firstUrl" placeholder="首帧公开图片 URL（可选）"><input class="url" id="lastUrl" placeholder="尾帧公开图片 URL（可选）"></div></div></div>
            <div class="media-area" id="referenceMedia" hidden><div class="media-inner"><div><span class="media-note">加入视觉、动作或节奏参考；图片最多 9 个，视频和音频最多各 3 个。</span><div class="media-grid reference"><div class="ref-set"><label class="drop"><span><strong>＋ 参考图像</strong><small>最多 9 个 · 每个 ≤30MiB</small></span><input type="file" id="refImages" multiple accept="image/*,.heic,.heif"></label><textarea class="url" id="refImageUrls" placeholder="公开 URL，每行一个"></textarea></div><div class="ref-set"><label class="drop"><span><strong>＋ 参考视频</strong><small>MP4 / MOV · 2–15 秒</small></span><input type="file" id="refVideos" multiple accept="video/mp4,video/quicktime,.mov"></label><textarea class="url" id="refVideoUrls" placeholder="公开 URL，每行一个"></textarea></div><div class="ref-set"><label class="drop"><span><strong>＋ 参考音频</strong><small>MP3 / WAV · 2–15 秒</small></span><input type="file" id="refAudios" multiple accept="audio/mpeg,audio/wav,.mp3,.wav"></label><textarea class="url" id="refAudioUrls" placeholder="公开 URL，每行一个"></textarea></div></div></div></div></div>
            <div class="inline-result" id="result"></div>
          </div>
          <p class="flash" id="flash" role="status"></p>
          <div class="quickbar"><button data-prompt="一段电影感的城市清晨：阳光穿过高楼缝隙，行人从斑马线慢慢穿过，固定机位，轻微胶片颗粒。"><span>/</span>电影级长镜头</button><button data-prompt="一个完整的创意分镜，人物动作自然，镜头稳定推进，环境细节持续变化。"><span>/</span>创作分镜</button><button data-prompt="保持参考主体外观，模仿参考视频的动作节奏，画面连续，无切镜。"><span>/</span>参考主体一致性</button><button data-prompt="一支 4 秒的竖屏短片，干净有节奏，适合社交媒体首屏。"><span>/</span>竖屏短片</button></div>
        </section>
        <p class="notice"><b>本机模式：</b>API Key 通过 macOS 钥匙串保存；参考素材会随生成请求发送到所选服务。成功视频会立即下载到此工具的 <code>outputs/</code>，避免临时链接过期。</p>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog id="keyDialog"><form method="dialog" id="keyForm"><h3>配置本机 API Key</h3><p>选择服务后输入对应 Key。三者分别保存在 macOS 钥匙串，不存入浏览器、本项目或本地日志。</p><div class="key-service-picker" role="group" aria-label="选择密钥服务"><button type="button" class="active" data-key-provider="tokenhub">MiniMax H3</button><button type="button" data-key-provider="apimart">APIMart Midjourney</button><button type="button" data-key-provider="qallm">要务测试网关<br>Seedance 2.0 / 2.5</button></div><input id="keyInput" type="password" autocomplete="off" placeholder="TokenHub API Key" required><div class="dialog-actions"><button type="submit">写入钥匙串</button><button type="button" class="cancel" id="closeKey">取消</button></div><p class="flash" id="keyFlash"></p></form></dialog>
    <script>
      const $ = (id) => document.getElementById(id); let toastTimer = null; const referenceItems = []; const imageReferenceItems = []; const queueTimers = new Map(); const QUEUE_STORAGE_KEY = 'minimax-h3-studio.queue.v2';
      const queueItems = [];
